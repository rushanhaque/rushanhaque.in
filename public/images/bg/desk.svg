<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- The hero's backdrop: a developer's code and a writer's manuscript, side by side on one desk.
       Drawn for rushanhaque.in. Ink #07241a, brass #7a1f3d. Shown faint and washed behind the name. -->
  <defs>
    <style>
      .code{font:500 21px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#07241a}
      .num{font:400 17px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#07241a;opacity:.35}
      .kw{fill:#7a1f3d}
      .str{fill:#3d6b52}
      .dim{opacity:.45}
      .prose{font:italic 400 27px/1 Georgia,'Times New Roman',serif;fill:#07241a}
      .head{font:400 44px/1 Georgia,'Times New Roman',serif;fill:#07241a}
      .hand{font:italic 400 24px/1 'Segoe Script','Bradley Hand','Snell Roundhand',cursive;fill:#7a1f3d}
      .mark{fill:none;stroke:#7a1f3d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .rule{stroke:#07241a;stroke-width:1;opacity:.14}
      .edge{fill:none;stroke:#07241a;stroke-width:1.4;opacity:.55}
      .tab{font:500 15px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#07241a;opacity:.6}
    </style>
  </defs>

  <!-- The code sheet -->
  <g transform="translate(70 120) rotate(-4)">
    <rect class="edge" x="0" y="0" width="820" height="720" rx="14"/>
    <line class="rule" x1="0" y1="46" x2="820" y2="46"/>
    <circle cx="26" cy="23" r="6" fill="#07241a" opacity=".25"/><circle cx="48" cy="23" r="6" fill="#07241a" opacity=".25"/><circle cx="70" cy="23" r="6" fill="#07241a" opacity=".25"/>
    <text class="tab" x="104" y="28">build.ts</text>
    <text class="tab" x="200" y="28" opacity=".35">story.md</text>
    <line class="rule" x1="62" y1="46" x2="62" y2="720"/>
    <g transform="translate(0 92)">
      <text class="num" x="22" y="0">1</text><text class="code" x="84" y="0"><tspan class="kw">import</tspan> { sketch, design, launch } <tspan class="kw">from</tspan> <tspan class="str">'./studio'</tspan>;</text>
      <text class="num" x="22" y="40">2</text>
      <text class="num" x="22" y="80">3</text><text class="code" x="84" y="80"><tspan class="dim">// Every site starts as a drawing.</tspan></text>
      <text class="num" x="22" y="120">4</text><text class="code" x="84" y="120"><tspan class="kw">export async function</tspan> build(brief) {</text>
      <text class="num" x="22" y="160">5</text><text class="code" x="84" y="160">  <tspan class="kw">const</tspan> plan = <tspan class="kw">await</tspan> sketch(brief);</text>
      <text class="num" x="22" y="200">6</text><text class="code" x="84" y="200">  <tspan class="kw">const</tspan> pages = plan.pages.map(page =&gt;</text>
      <text class="num" x="22" y="240">7</text><text class="code" x="84" y="240">    design(page, { mobileFirst: <tspan class="kw">true</tspan> })</text>
      <text class="num" x="22" y="280">8</text><text class="code" x="84" y="280">  );</text>
      <text class="num" x="22" y="320">9</text><text class="code" x="84" y="320">  <tspan class="kw">for</tspan> (<tspan class="kw">const</tspan> page <tspan class="kw">of</tspan> pages) {</text>
      <text class="num" x="22" y="360">10</text><text class="code" x="84" y="360">    <tspan class="kw">await</tspan> page.write({ fast: <tspan class="kw">true</tspan>, found: <tspan class="kw">true</tspan> });</text>
      <text class="num" x="22" y="400">11</text><text class="code" x="84" y="400">  }</text>
      <text class="num" x="22" y="440">12</text><text class="code" x="84" y="440">  <tspan class="kw">return</tspan> launch(pages, { owner: brief.client });</text>
      <text class="num" x="22" y="480">13</text><text class="code" x="84" y="480">}</text>
      <text class="num" x="22" y="520">14</text>
      <text class="num" x="22" y="560">15</text><text class="code" x="84" y="560">build(<tspan class="str">'your business'</tspan>)</text>
      <rect x="352" y="541" width="12" height="25" fill="#7a1f3d" opacity=".8"/>
    </g>
  </g>

  <!-- The manuscript -->
  <g transform="translate(860 150) rotate(3.5)">
    <rect class="edge" x="0" y="0" width="640" height="790" rx="4"/>
    <g>
      <line class="rule" x1="40" y1="200" x2="600" y2="200"/><line class="rule" x1="40" y1="250" x2="600" y2="250"/>
      <line class="rule" x1="40" y1="300" x2="600" y2="300"/><line class="rule" x1="40" y1="350" x2="600" y2="350"/>
      <line class="rule" x1="40" y1="400" x2="600" y2="400"/><line class="rule" x1="40" y1="450" x2="600" y2="450"/>
      <line class="rule" x1="40" y1="500" x2="600" y2="500"/><line class="rule" x1="40" y1="550" x2="600" y2="550"/>
      <line class="rule" x1="40" y1="600" x2="600" y2="600"/><line class="rule" x1="40" y1="650" x2="600" y2="650"/>
      <line class="rule" x1="40" y1="700" x2="600" y2="700"/>
      <line x1="84" y1="160" x2="84" y2="760" stroke="#7a1f3d" stroke-width="1.2" opacity=".5"/>
    </g>
    <text class="tab" x="40" y="62">CHAPTER THREE</text>
    <text class="head" x="40" y="126">On making things</text>
    <text class="prose" x="100" y="192">A good page works like a good room:</text>
    <text class="prose" x="100" y="242">every line earns its place, nothing</text>
    <text class="prose" x="100" y="292">is there for decoration, and the</text>
    <text class="prose" x="100" y="342">reader always knows where to go next.</text>
    <text class="prose" x="100" y="392">Write it plainly. Build it so it lasts.</text>
    <text class="prose" x="100" y="442">Then read it aloud, and cut what does</text>
    <text class="prose" x="100" y="492">not sound like you.</text>
    <text class="prose" x="100" y="592">The rest is patience, and the courage</text>
    <text class="prose" x="100" y="642">to leave a sentence alone.</text>
    <!-- Proofreading marks -->
    <path class="mark" d="M318 284 L458 284"/>
    <text class="hand" x="330" y="262">made</text>
    <path class="mark" d="M318 296 l8 -16 l8 16"/>
    <ellipse class="mark" cx="246" cy="384" rx="62" ry="26"/>
    <text class="hand" x="618" y="392" text-anchor="end">stet</text>
    <path class="mark" d="M560 434 q14 0 14 14 t14 14"/>
    <text class="hand" x="46" y="592">¶</text>
    <path class="mark" d="M100 504 L262 504" opacity=".7"/>
  </g>

  <!-- A fountain pen resting across both -->
  <g transform="translate(780 700) rotate(-28)" class="edge" style="opacity:.7">
    <path d="M0 0 L300 0 Q330 0 330 14 Q330 28 300 28 L0 28 Q-14 28 -14 14 Q-14 0 0 0Z"/>
    <path d="M330 4 L420 14 L330 24"/>
    <path d="M360 14 L420 14"/>
    <path d="M60 0 L60 28 M76 0 L76 28"/>
    <path d="M-14 14 L-40 14" />
  </g>
</svg>
