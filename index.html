<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/mona.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!--app-head-->
    <style>
      @font-face { font-family: 'Mona Sans'; src: url(/fonts/mona.woff2) format('woff2'); font-weight: 200 800; font-stretch: 75% 125%; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Mona Sans'; src: url(/fonts/mona-ext.woff2) format('woff2'); font-weight: 200 800; font-stretch: 75% 125%; font-style: normal; font-display: swap; unicode-range: U+0100-017F; }
      @font-face { font-family: 'Instrument Serif'; src: url(/fonts/serif-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
      @font-face { font-family: 'Instrument Serif'; src: url(/fonts/serif.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Six Caps'; src: url(/fonts/six-caps.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'DM Mono'; src: url(/fonts/dm-mono.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      html { background: #f7f4f1; } body { margin: 0; }
      /* The opening, painted by the HTML before any script: hello in the languages of the people the work is for, then
         the sheet lifts away on a curve. */
      #cover { display: none; }
      .intro #cover { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #241419; color: #fff; animation: cvAway .5s 6.5s forwards; }
      .cv__words { display: grid; font-family: 'Mona Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 380; font-size: clamp(40px, 6vw, 84px); line-height: 1.15; font-stretch: 112%; letter-spacing: -.035em; animation: cvIn .6s cubic-bezier(.16,1,.3,1) .1s both; transition: transform .9s cubic-bezier(.76,0,.24,1), opacity .5s; }
      .cv__w { grid-area: 1 / 1; justify-self: center; display: flex; align-items: center; gap: .3em; white-space: nowrap; visibility: hidden; animation: cvOn var(--t) steps(1, end) var(--d); }
      .cv__w::before { content: ''; flex: none; width: .17em; height: .17em; border-radius: 50%; background: #d9b97e; }
      .cv__w:last-child { animation-fill-mode: forwards; }
      .cv__curve { position: absolute; left: -15%; top: calc(100% - 1px); width: 130%; height: 16vh; border-radius: 0 0 50% 50%; background: #241419; transform-origin: 50% 0; transition: transform 1.15s cubic-bezier(.76,0,.24,1); }
      .cv-out #cover { transform: translateY(calc(-100% - 16vh)); transition: transform 1.15s cubic-bezier(.76,0,.24,1); }
      .cv-out .cv__words { transform: translateY(-8vh); opacity: 0; }
      .cv-out .cv__curve { transform: scaleY(.15); }
      @keyframes cvOn { 0%, 100% { visibility: visible; } }
      @keyframes cvIn { from { opacity: 0; transform: translateY(14px); } }
      @keyframes cvAway { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #cover { display: none !important; } }
    </style>
    <script>
      (function () {
        var d = document.documentElement, c = d.classList, m = function (q) { return matchMedia(q).matches }
        var reduced = m('(prefers-reduced-motion: reduce)')
        c.add('js', reduced ? 'reduced' : 'motion')
        // what this device can carry, decided before anything paints: low skips the costly flourishes
        var n = navigator, q = '', low, mid
        try { q = new URLSearchParams(location.search).get('tier') || '' } catch (e) {}
        low = (n.connection && (n.connection.saveData || /(^|-)2g/.test(n.connection.effectiveType || ''))) || (n.deviceMemory || 8) <= 2 || (n.hardwareConcurrency || 8) <= 2
        mid = m('(hover: none), (pointer: coarse)') || (n.deviceMemory || 8) <= 4 || (n.hardwareConcurrency || 8) <= 4
        d.setAttribute('data-tier', /^(low|mid|high)$/.test(q) ? q : low ? 'low' : mid ? 'mid' : 'high')
        try {
          if (!reduced && location.pathname === '/' && !sessionStorage.getItem('rh-seen') && location.search.indexOf('skip') < 0) {
            c.add('intro')
            setTimeout(function () { c.remove('intro'); var e = document.getElementById('cover'); if (e) e.remove() }, 7200)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="cover" aria-hidden="true">
      <div class="cv__words"><span class="cv__w" lang="hi" style="--d:0.15s;--t:0.80s">नमस्ते</span><span class="cv__w" lang="fr" style="--d:0.95s;--t:0.14s">Bonjour</span><span class="cv__w" lang="ur" style="--d:1.09s;--t:0.14s">آداب</span><span class="cv__w" lang="ar" style="--d:1.23s;--t:0.14s">مرحبا</span><span class="cv__w" lang="pl" style="--d:1.37s;--t:0.14s">Cześć</span><span class="cv__w" lang="ne" style="--d:1.51s;--t:0.14s">नमस्कार</span><span class="cv__w" lang="en" style="--d:1.65s;--t:0.50s">Hello</span></div>
      <i class="cv__curve"></i>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
