    <style>
      @font-face { font-family: 'Mona Sans'; src: url(/fonts/mona.woff2) format('woff2'); font-weight: 300 700; font-stretch: 100% 125%; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Mona Sans'; src: url(/fonts/mona-ext.woff2) format('woff2'); font-weight: 300 700; font-stretch: 100% 125%; font-style: normal; font-display: swap; unicode-range: U+0100-017F; }
      @font-face { font-family: 'Six Caps'; src: url(/fonts/six-caps.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'DM Mono'; src: url(/fonts/dm-mono.woff2) format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
      html { background: #120a0c; } body { margin: 0; }
      #cover { display: none; }
      .intro #cover { display: grid; position: fixed; inset: 0; z-index: 90; place-items: center; background: #120a0c; color: #d9b97e; }
      #cover svg { display: block; width: min(52vw, 340px); height: auto; overflow: visible; animation: write 1.15s cubic-bezier(.65, 0, .35, 1) .12s both; }
      #cover i { display: block; width: min(30vw, 150px); height: 1px; margin: 22px auto 0; background: currentColor; opacity: .55; transform-origin: 100% 50%; animation: draw 1.15s cubic-bezier(.65, 0, .35, 1) .12s both; }
      @keyframes write { from { clip-path: inset(-20% -5% -20% 105%); } to { clip-path: inset(-20% -5% -20% -5%); } }
      @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #cover { display: none !important; } }
    </style>
    <script>
      (function () {
        var h = document.documentElement, c = h.classList, r = matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!r) c.remove('static')
        try {
          var n = navigator, t = new URLSearchParams(location.search).get('tier')
          var low = n.connection && (n.connection.saveData || /(^|-)2g/.test(n.connection.effectiveType || '')) || (n.deviceMemory || 8) <= 2 || (n.hardwareConcurrency || 8) <= 2
          if (!r && window.WebGL2RenderingContext && t !== 'low' && (t || !low)) c.add('can-gl')
        } catch (e) {}
        try {
          if (!r && location.pathname === '/' && !sessionStorage.getItem('rh-seen') && location.search.indexOf('skip') < 0) {
            c.add('intro')
            setTimeout(function () { c.remove('intro'); var e = document.getElementById('cover'); if (e) e.remove() }, 7000)
          }
        } catch (e) {}
      })()
    </script>
